const T={
en:{dir:"ltr",sub:"A scientific guide for a new PhD journey",
me:["About me","Dr. Muhammet Lahmuni","Researcher and PhD candidate in Chemical Engineering at Yalova University, currently in the thesis and research stage, and a chemistry teacher in the Canadian section of Okyanus Schools in Istanbul. My MSc thesis on SPEEK polymer electrolytes (characterized by PALS) received the 2024 Best Thesis Award, and my earlier work focused on polymer electrolytes and energy storage. I am now moving into algae chemistry, bioenergy and sustainable energy, and this site is a scientific blog where I will share what I study."],
s:[
["1. What is Spirulina?","<p>“Spirulina” is the common name of filamentous, spiral-shaped <b>cyanobacteria</b> (blue-green algae) of the genus <i>Arthrospira</i>, mainly <i>A. platensis</i> and <i>A. maxima</i>. It is a prokaryote that performs oxygenic photosynthesis, not a true eukaryotic alga. It grows naturally in warm, alkaline, mineral-rich lakes (Chad, Mexico, East Africa) and was a traditional food of the Kanembu people and the Aztecs.</p>"],
["2. Biology & growth","<ul><li>Cells form helical, multicellular filaments (trichomes) 0.2–0.5 mm long, which makes harvesting by filtration easy.</li><li>Optimum: pH 9–11, 30–37 °C, high bicarbonate and salinity, which suppresses most competitors.</li><li>Light, CO₂/bicarbonate, nitrogen and mixing control productivity; typical yields are 10–25 g dry mass m⁻² day⁻¹.</li><li>Standard medium: <b>Zarrouk</b> (NaHCO₃, NaNO₃, K₂HPO₄, trace metals).</li></ul>"],
["3. Chemical composition","<ul><li><b>Protein 55–70 %</b> of dry weight, with all essential amino acids.</li><li>Carbohydrates 15–25 %, lipids 5–7 % (rich in γ-linolenic acid, GLA).</li><li>Pigments: <b>phycocyanin</b> (blue), chlorophyll a, carotenoids (β-carotene, zeaxanthin).</li><li>Vitamins (B-group, E), minerals (iron, magnesium), polysaccharides such as calcium spirulan.</li><li>Note: its “vitamin B12” is mostly the inactive analogue pseudovitamin B12.</li></ul>"],
["4. Phycocyanin: the star molecule","<p>C-phycocyanin is a water-soluble phycobiliprotein (α and β subunits with phycocyanobilin chromophores) that harvests light at about 620 nm. It is used as a natural blue food colorant, in cosmetics and as a fluorescent label, and shows antioxidant and anti-inflammatory activity. It is sensitive to heat (above ~45 °C), light and low pH, so extraction (freeze–thaw, ultrasound, aqueous buffers) and stabilization are active research areas. Purity is judged by the A620/A280 ratio (food grade ≈ 0.7, analytical ≥ 4).</p>"],
["5. Cultivation & processing","<ul><li><b>Open raceway ponds</b>: cheap, but exposed to contamination and weather.</li><li><b>Closed photobioreactors</b>: controlled and clean, but costly.</li><li>Downstream: filtration or screening, washing, then spray drying or sun drying; extraction of pigments, proteins and lipids.</li></ul>"],
["6. Applications","<p><span class='tag'>Food & nutraceuticals</span><span class='tag'>Animal & fish feed</span><span class='tag'>Cosmetics</span><span class='tag'>Biofertilizer</span><span class='tag'>Wastewater treatment</span><span class='tag'>Biofuel & biogas</span><span class='tag'>Bioplastics</span><span class='tag'>Carbon materials</span></p>"],
["7. Safety & quality","<p>Spirulina itself is generally recognized as safe, but quality depends on the growth water: contamination with other cyanobacteria can bring <b>microcystins</b>, and biomass can accumulate <b>heavy metals</b> (As, Pb, Cd). Quality control means species verification, toxin testing and metal analysis.</p>"],
["8. Your thesis angle: geothermal water & LCA","<p>Geothermal water (such as in Yalova–Armutlu) offers low-cost heat, minerals and a stable temperature that can cut the energy cost of cultivation. <b>Life Cycle Assessment (LCA, ISO 14040/14044)</b> quantifies the environmental footprint across goal and scope, inventory, impact assessment and interpretation, so you can compare geothermal-based cultivation with conventional systems (global warming, energy, water use, eutrophication).</p>"]],
ideas:["💡 Advanced ideas for your research",["<b>Techno-economic analysis (TEA)</b> next to LCA, to show both cost and carbon.","<b>CO₂ capture</b>: using flue or geothermal CO₂ as carbon source.","<b>Biorefinery</b>: phycocyanin first, then protein, then residual biomass to biogas or biochar.","<b>Spirulina-derived carbon</b> (N-doped) for supercapacitor and Li-ion electrodes, which connects to your electrochemistry background.","<b>Biopolymers</b>: spirulina protein or PHB-based bioplastics as a bridge to your polymer expertise.","<b>Machine learning</b> to optimize light, pH and nutrients, plus scenario and sensitivity analysis in LCA software (openLCA)."]],
read:"Suggested reading: reviews on Arthrospira cultivation, phycocyanin extraction, and algae LCA in journals such as Algal Research and Journal of Cleaner Production.",
f:"© 2026 Dr. Muhammet Lahmuni · Educational content, not medical advice"},
ar:{dir:"rtl",sub:"دليل علمي لرحلة دكتوراه جديدة",
me:["نبذة عني","د. محمد لحموني","باحث وطالب دكتوراه في الهندسة الكيميائية بجامعة يالوفا في مرحلة الأطروحة والبحث، ومعلم كيمياء في القسم الكندي في مدارس أوكيانوس في إسطنبول. نالت رسالة الماجستير عن الإلكتروليتات البوليمرية SPEEK (بتقنية PALS) جائزة أفضل رسالة لعام 2024، وكان عملي السابق في الإلكتروليتات البوليمرية وتخزين الطاقة. أنتقل الآن إلى كيمياء الطحالب والطاقة الحيوية والطاقة المستدامة، وهذا الموقع مدونة علمية سأنشر فيها ما أدرسه."],
s:[
["١. ما هي السبيرولينا؟","<p>«سبيرولينا» اسم شائع لـ<b>البكتيريا الزرقاء</b> (الطحالب الخضراء المزرقة) الخيطية الحلزونية من جنس <i>Arthrospira</i>، وأشهرها <i>A. platensis</i> و<i>A. maxima</i>. هي كائن بدائي النواة يقوم بالتمثيل الضوئي المنتج للأكسجين، وليست طحلباً حقيقياً. تنمو طبيعياً في البحيرات الدافئة القلوية الغنية بالمعادن (تشاد، المكسيك، شرق أفريقيا)، وكانت غذاءً تقليدياً لشعب الكانيمبو والأزتك.</p>"],
["٢. البيولوجيا والنمو","<ul><li>تتكوّن الخلايا من خيوط حلزونية متعددة الخلايا طولها 0.2–0.5 ملم، مما يسهّل الحصاد بالترشيح.</li><li>الظروف المثلى: pH بين 9 و11، حرارة 30–37°م، بيكربونات وملوحة عالية تثبّط معظم المنافسين.</li><li>الإنتاجية تتحكم بها الإضاءة وCO₂/البيكربونات والنيتروجين والخلط؛ المعدل النموذجي 10–25 غ وزن جاف/م²/يوم.</li><li>الوسط القياسي: <b>زاروك</b> (NaHCO₃ وNaNO₃ وK₂HPO₄ وعناصر أثرية).</li></ul>"],
["٣. التركيب الكيميائي","<ul><li><b>بروتين 55–70%</b> من الوزن الجاف، ويحوي كل الأحماض الأمينية الأساسية.</li><li>كربوهيدرات 15–25%، ودهون 5–7% (غنية بحمض غاما لينولينيك GLA).</li><li>أصباغ: <b>الفيكوسيانين</b> (أزرق)، كلوروفيل a، كاروتينات (بيتا كاروتين، زياكسانثين).</li><li>فيتامينات (مجموعة B وE) ومعادن (الحديد، المغنيسيوم) وسكريات مثل سبيرولان الكالسيوم.</li><li>ملاحظة: «فيتامين B12» فيها هو في الغالب نظير غير فعّال.</li></ul>"],
["٤. الفيكوسيانين: الجزيء النجم","<p>C-فيكوسيانين بروتين صباغي ذائب في الماء (وحدتان α وβ مع كروموفور فيكوسيانوبيلين) يمتص الضوء عند نحو 620 نانومتر. يُستخدم ملوّناً أزرق طبيعياً للأغذية، وفي مستحضرات التجميل، وكواسم فلوري، وله نشاط مضاد للأكسدة والالتهاب. يتأثر بالحرارة (فوق ~45°م) والضوء والحموضة، لذلك فإن الاستخلاص (تجميد–إذابة، موجات فوق صوتية، محاليل مائية) والتثبيت مجالان بحثيان نشطان. تُقاس النقاوة بنسبة A620/A280 (درجة غذائية ≈ 0.7، تحليلية ≥ 4).</p>"],
["٥. الزراعة والمعالجة","<ul><li><b>أحواض السباق المفتوحة</b>: رخيصة، لكنها عرضة للتلوث والطقس.</li><li><b>المفاعلات الضوئية المغلقة</b>: دقيقة ونظيفة لكنها مكلفة.</li><li>ما بعد الحصاد: ترشيح، غسل، ثم تجفيف بالرذاذ أو بالشمس؛ واستخلاص الأصباغ والبروتينات والدهون.</li></ul>"],
["٦. التطبيقات","<p><span class='tag'>غذاء ومكملات</span><span class='tag'>أعلاف وأسماك</span><span class='tag'>مستحضرات تجميل</span><span class='tag'>أسمدة حيوية</span><span class='tag'>معالجة مياه الصرف</span><span class='tag'>وقود حيوي وبيوغاز</span><span class='tag'>بلاستيك حيوي</span><span class='tag'>مواد كربونية</span></p>"],
["٧. السلامة والجودة","<p>السبيرولينا بحد ذاتها آمنة عموماً، لكن الجودة تعتمد على ماء النمو: التلوث ببكتيريا زرقاء أخرى قد يجلب <b>الميكروسيستينات</b>، وقد تتراكم <b>المعادن الثقيلة</b> (As وPb وCd). لذا يشمل ضبط الجودة تأكيد النوع وفحص السموم وتحليل المعادن.</p>"],
["٨. زاوية أطروحتك: المياه الجوفية الحرارية وتحليل دورة الحياة","<p>توفّر المياه الجوفية الحرارية (كما في يالوفا–أرموتلو) حرارة منخفضة التكلفة ومعادن ودرجة حرارة مستقرة، ما يقلل طاقة الزراعة. أما <b>تقييم دورة الحياة (LCA، ISO 14040/14044)</b> فيقيس البصمة البيئية عبر تحديد الهدف والنطاق، وجرد المدخلات، وتقييم الأثر، والتفسير، لمقارنة الزراعة الحرارية بالأنظمة التقليدية (الاحتباس الحراري، الطاقة، المياه، الإثراء الغذائي).</p>"]],
ideas:["💡 أفكار متقدمة لبحثك",["<b>التحليل التقني-الاقتصادي (TEA)</b> إلى جانب LCA لإظهار الكلفة والكربون معاً.","<b>احتجاز CO₂</b>: استخدام ثاني أكسيد الكربون من العوادم أو المياه الحرارية كمصدر كربون.","<b>المصفاة الحيوية</b>: الفيكوسيانين أولاً، ثم البروتين، ثم المتبقي إلى بيوغاز أو فحم حيوي.","<b>كربون مشتق من السبيرولينا</b> (مُطعّم بالنيتروجين) لأقطاب المكثفات الفائقة وبطاريات الليثيوم، وهو يربط الموضوع بخلفيتك الكهروكيميائية.","<b>البوليمرات الحيوية</b>: بلاستيك من بروتين السبيرولينا أو PHB كجسر لخبرتك في البوليمرات.","<b>التعلم الآلي</b> لتحسين الإضاءة وpH والمغذيات، مع تحليل السيناريوهات والحساسية في برنامج openLCA."]],
read:"للقراءة: مراجعات علمية حول زراعة Arthrospira واستخلاص الفيكوسيانين وLCA للطحالب في مجلات مثل Algal Research وJournal of Cleaner Production.",
f:"© 2026 د. محمد لحموني · محتوى تعليمي وليس نصيحة طبية"},
tr:{dir:"ltr",sub:"Yeni bir doktora yolculuğu için bilimsel rehber",
me:["Hakkımda","Dr. Muhammet Lahmuni","Yalova Üniversitesi’nde Kimya Mühendisliği alanında araştırmacı ve doktora adayıyım; şu anda tez ve araştırma aşamasındayım. İstanbul’da Okyanus Okulları’nın Kanada bölümünde kimya öğretmeniyim. SPEEK polimer elektrolitleri (PALS ile karakterizasyon) üzerine yüksek lisans tezim 2024 En İyi Tez Ödülü’nü aldı; önceki çalışmalarım polimer elektrolitler ve enerji depolama üzerineydi. Şimdi alg kimyası, biyoenerji ve sürdürülebilir enerjiye yöneliyorum; bu site, çalıştıklarımı paylaşacağım bir bilim blogudur."],
s:[
["1. Spirulina nedir?","<p>“Spirulina”, <i>Arthrospira</i> cinsine ait, filamentli ve sarmal şekilli <b>siyanobakterilerin</b> (mavi-yeşil alglerin) yaygın adıdır; en bilinenleri <i>A. platensis</i> ve <i>A. maxima</i>’dır. Oksijenik fotosentez yapan bir prokaryottur, gerçek bir alg değildir. Sıcak, alkali ve mineralce zengin göllerde (Çad, Meksika, Doğu Afrika) doğal olarak yaşar; Kanembu halkının ve Azteklerin geleneksel gıdasıydı.</p>"],
["2. Biyoloji ve büyüme","<ul><li>Hücreler 0,2–0,5 mm uzunluğunda sarmal çok hücreli filamentler oluşturur; bu da süzmeyle hasadı kolaylaştırır.</li><li>Optimum: pH 9–11, 30–37 °C, yüksek bikarbonat ve tuzluluk; çoğu rakibi baskılar.</li><li>Verimi ışık, CO₂/bikarbonat, azot ve karıştırma belirler; tipik verim 10–25 g kuru madde m⁻² gün⁻¹.</li><li>Standart ortam: <b>Zarrouk</b> (NaHCO₃, NaNO₃, K₂HPO₄, iz elementler).</li></ul>"],
["3. Kimyasal bileşim","<ul><li>Kuru ağırlığın <b>%55–70’i protein</b>, tüm temel amino asitleri içerir.</li><li>Karbonhidrat %15–25, lipit %5–7 (γ-linolenik asit, GLA bakımından zengin).</li><li>Pigmentler: <b>fikosiyanin</b> (mavi), klorofil a, karotenoidler (β-karoten, zeaksantin).</li><li>Vitaminler (B grubu, E), mineraller (demir, magnezyum), kalsiyum spirulan gibi polisakkaritler.</li><li>Not: “B12 vitamini” çoğunlukla aktif olmayan analogudur.</li></ul>"],
["4. Fikosiyanin: yıldız molekül","<p>C-fikosiyanin, suda çözünen bir fikobiliproteindir (fikosiyanobilin kromoforlu α ve β alt birimleri) ve yaklaşık 620 nm’de ışık toplar. Doğal mavi gıda boyası, kozmetik ve floresan etiket olarak kullanılır; antioksidan ve antienflamatuvar etkisi vardır. Isıya (~45 °C üzeri), ışığa ve düşük pH’a duyarlıdır; bu yüzden ekstraksiyon (dondur–çöz, ultrason, sulu tamponlar) ve stabilizasyon aktif araştırma alanlarıdır. Saflık A620/A280 oranıyla ölçülür (gıda sınıfı ≈ 0,7, analitik ≥ 4).</p>"],
["5. Kültivasyon ve işleme","<ul><li><b>Açık yarış havuzları</b>: ucuz, ancak kirlenmeye ve havaya açık.</li><li><b>Kapalı fotobiyoreaktörler</b>: kontrollü ve temiz, ancak pahalı.</li><li>Sonrası: süzme, yıkama, püskürtmeli veya güneşte kurutma; pigment, protein ve lipit ekstraksiyonu.</li></ul>"],
["6. Uygulamalar","<p><span class='tag'>Gıda ve takviyeler</span><span class='tag'>Hayvan ve balık yemi</span><span class='tag'>Kozmetik</span><span class='tag'>Biyogübre</span><span class='tag'>Atıksu arıtımı</span><span class='tag'>Biyoyakıt ve biyogaz</span><span class='tag'>Biyoplastik</span><span class='tag'>Karbon malzemeler</span></p>"],
["7. Güvenlik ve kalite","<p>Spirulina genel olarak güvenli kabul edilir, ancak kalite büyüme suyuna bağlıdır: diğer siyanobakterilerle kirlenme <b>mikrosistinleri</b> getirebilir, biyokütle <b>ağır metalleri</b> (As, Pb, Cd) biriktirebilir. Kalite kontrol; tür doğrulama, toksin testi ve metal analizini içerir.</p>"],
["8. Tez bakış açınız: jeotermal su ve YDA","<p>Jeotermal su (Yalova–Armutlu gibi) düşük maliyetli ısı, mineral ve kararlı sıcaklık sunarak kültivasyon enerjisini azaltabilir. <b>Yaşam Döngüsü Analizi (YDA/LCA, ISO 14040/14044)</b>; amaç ve kapsam, envanter, etki değerlendirmesi ve yorumlama adımlarıyla çevresel ayak izini hesaplar ve jeotermal tabanlı üretimi geleneksel sistemlerle (küresel ısınma, enerji, su kullanımı, ötrofikasyon) karşılaştırmanızı sağlar.</p>"]],
ideas:["💡 Araştırmanız için ileri fikirler",["<b>Tekno-ekonomik analiz (TEA)</b>: LCA ile birlikte hem maliyeti hem karbonu göstermek için.","<b>CO₂ yakalama</b>: baca gazı veya jeotermal CO₂’yi karbon kaynağı olarak kullanmak.","<b>Biyorafineri</b>: önce fikosiyanin, sonra protein, kalanı biyogaz veya biyokömüre.","<b>Spirulina kaynaklı karbon</b> (N katkılı) süperkapasitör ve Li-iyon elektrotları için; elektrokimya geçmişinize bağlanır.","<b>Biyopolimerler</b>: spirulina proteini veya PHB bazlı biyoplastikler; polimer uzmanlığınıza köprü.","<b>Makine öğrenmesi</b> ile ışık, pH ve besin optimizasyonu; openLCA’da senaryo ve duyarlılık analizi."]],
