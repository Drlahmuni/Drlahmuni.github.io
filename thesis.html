<script>
const R=["Ye C. et al. (2018) Life cycle assessment of industrial scale production of spirulina tablets. <i>Algal Research</i> 34:154–163. doi:10.1016/j.algal.2018.07.013","Fournadzhieva S. et al. (2002) Use of geothermal fluids for cultivation of the microalga Spirulina in Nigrita–Serres. <i>7th National Conference on Soft Energy Forms</i>, Patras, 6–8 Nov 2002, pp. 97–104.","Godlewska K. et al. (2015) Prospects of geothermal water use in cultivation of Spirulina. <i>Open Chemistry</i> 13:1218–1227. doi:10.1515/chem-2015-0134","Yang Z. et al. (2022) Dynamic changes of growth and physiological parameters of Spirulina cultivated outdoors: a case study in Spirulina Industrial Park in Inner Mongolia, China. <i>J Appl Phycol</i> 34:1163–1175. doi:10.1007/s10811-021-02680-0","Braud L. et al. (2025) Life cycle assessment of algal products: a step-by-step guide to application. EABA Information Paper v1.0, Zenodo. doi:10.5281/zenodo.16270293","Hossain N. et al. (2019) Techno-economics and sensitivity analysis of microalgae as commercial feedstock for bioethanol production. <i>Environ Prog Sustain Energy</i>. doi:10.1002/ep.13157","Allen J. et al. (2018) Integration of biology, ecology and engineering for sustainable algal-based biofuel and bioproduct biorefinery. <i>Bioresour Bioprocess</i> 5:47. doi:10.1186/s40643-018-0233-5"];
const box=(x,e,c)=>`<rect x="${x}" y="40" width="70" height="44" rx="10" fill="${c}"/><text x="${x+35}" y="70" font-size="24" text-anchor="middle">${e}</text>`;
const FIG='<svg viewBox="0 0 400 130" aria-hidden="true"><rect x="12" y="14" width="376" height="100" rx="14" fill="none" stroke="#1b5fa8" stroke-width="2" stroke-dasharray="6 5"/>'+box(28,"♨️","#f5c54299")+box(118,"🌿","#1fb98f99")+box(208,"🏭","#9bb8af99")+box(298,"📦","#1b5fa899")+'<g stroke="currentColor" stroke-width="3"><path d="M100 62h14M190 62h14M280 62h14"/></g></svg>';
const T={
en:{dir:"ltr",bk:"← Back to the Spirulina guide",f:"© 2026 Dr. Muhammet Lahmuni · Working draft, not peer reviewed",
ti:"Life Cycle Assessment of Arthrospira platensis Production Using Geothermal Water: Resource Efficiency, Uncertainty Analysis, and Multi-Objective Optimization",
st:"Working draft of a research proposal. Statements come from the cited literature. Research questions, hypotheses and methods are plans, not results.",
cap:"Illustrative sketch of a possible system boundary (geothermal heat and CO₂ → cultivation → harvesting and drying → dry biomass). To be defined in the study.",rh:"References",
s:[["1. Why this topic","<p>In a published cradle-to-gate LCA of Spirulina tablets, cultivation caused 82% of the global warming potential, mainly through sodium bicarbonate and electricity [1]. Cold climates add a heating burden [4][6]. In Greece, geothermal heating in a greenhouse raised the daily yield by 20–30% in spring and autumn and extended the season (March–November), and freely released geothermal CO₂ cut technological costs by over 25% [2].</p>"],
["2. Evidence so far","<ul><li><b>[1] Ye et al. 2018:</b> cultivation dominates; 7.7 kg CO₂-eq per kg of tablets in the current scenario; better nutrient use cut impacts by 30–40%. The analysis was deterministic and the authors call for uncertainty analysis.</li><li><b>[2] Fournadzhieva et al. 2002</b> (Nigrita, Greece): the geothermal water (47 °C) was not used in the culture because of arsenic (0.5 ppm) and strontium; heated fresh water was used instead.</li><li><b>[3] Godlewska et al. 2015:</b> a planned study for Poland; its estimated medium-cost saving from geothermal water is small (about 7.1 of 153.34 USD for a 1,500 L photobioreactor).</li><li><b>[4] Yang et al. 2022</b> (Inner Mongolia): 11.2 g m⁻² day⁻¹ in July; phosphorus supply could fall to one-third, saving 6–7% of nutrient cost.</li><li><b>[5] EABA 2025:</b> LCA guide (ISO 14040/44, Monte Carlo, pedigree matrices). In its illustrative case the allocation method changed the climate result per kg of blue extract from 81.1 to 130.9 kg CO₂-eq.</li><li><b>[6] Hossain et al. 2019:</b> techno-economic study of Chlorella bioethanol (not Spirulina, not an LCA): sensitivity analysis on input prices, and extra winter heating and electricity costs in cold countries.</li><li><b>[7] Allen et al. 2018:</b> review: nutrient and fresh-water costs and immature upstream technology hinder feasibility; integrating biology, ecology and engineering is proposed.</li></ul>"],
["3. Possible research gap (to be verified)","<p>Among the sources collected so far: (a) the Spirulina LCA found is deterministic [1]; (b) geothermal Spirulina studies address cost, yield and feasibility [2][3], and none of them is an LCA with geothermal inputs; (c) guidance for uncertainty methods exists [5]. This covers only the collected sources, so a systematic literature search is needed before claiming a gap.</p>"],
["4. Aim and research questions (working)","<ul><li><b>Aim:</b> assess the environmental performance of <i>A. platensis</i> production with geothermal water in the Yalova–Armutlu case.</li><li><b>RQ1:</b> which stages and inputs dominate the impacts per 1 kg of dry biomass?</li><li><b>RQ2:</b> how do geothermal heat, CO₂ and water change resource efficiency compared with conventional supply? (Hypothesis to test: geothermal heat lowers energy-related impacts.)</li><li><b>RQ3:</b> how uncertain are the results?</li><li><b>RQ4:</b> which configurations give the best trade-offs between impacts, cost and productivity?</li></ul>"],
["5. Planned methodology","<ul><li>LCA following ISO 14040/44 [5]; functional unit 1 kg dry biomass; cradle-to-gate boundary.</li><li>Inventory from primary data where available plus a background database; impact method to be chosen.</li><li>Uncertainty: Monte Carlo simulation and pedigree matrices; sensitivity analysis [5].</li><li>Multi-objective optimization: method and objectives to be selected.</li><li>Tools: openLCA or Brightway [5].</li><li>Design issue to address: arsenic in geothermal water [2]. Data availability still to be confirmed.</li></ul>"]]},
ar:{dir:"rtl",bk:"→ العودة إلى دليل السبيرولينا",f:"© 2026 د. محمد لحموني · مسودة عمل، لم تخضع للتحكيم",
ti:"تقييم دورة حياة إنتاج الإسبيرولينا (Arthrospira platensis) بالمياه الجيوحرارية: كفاءة الموارد، تحليل عدم اليقين، والتحسين متعدد الأهداف",
st:"مسودة عمل لمقترح بحثي. المعلومات مأخوذة من المراجع المذكورة، أما أسئلة البحث والفرضيات والمنهجية فهي خطط وليست نتائج.",
cap:"رسم توضيحي لحدود نظام محتملة (حرارة وCO₂ جيوحراريان ← الزراعة ← الحصاد والتجفيف ← الكتلة الحيوية الجافة). ستُحدَّد في الدراسة.",rh:"المراجع",
s:[["١. لماذا هذا الموضوع؟","<p>في دراسة LCA منشورة لأقراص السبيرولينا (من المهد إلى بوابة المصنع) تسببت الزراعة بـ 82% من إمكانية الاحترار العالمي، أساساً بسبب بيكربونات الصوديوم والكهرباء [1]. وتضيف المناطق الباردة عبء التدفئة [4][6]. وفي اليونان رفعت التدفئة الجيوحرارية داخل بيت زجاجي الإنتاج اليومي بنسبة 20–30% في الربيع والخريف ومدّدت الموسم (من مارس إلى نوفمبر)، وخفّض استخدام CO₂ الجيوحراري المتحرر مجاناً التكاليف التقنية بأكثر من 25% [2].</p>"],
["٢. ما تقوله الأدبيات حتى الآن","<ul><li><b>[1] Ye وآخرون 2018:</b> الزراعة هي المرحلة المهيمنة؛ 7.7 كغ CO₂-eq لكل كغ أقراص في السيناريو الحالي؛ وخفّض تحسين استخدام المغذيات الأثر بنسبة 30–40%. كان التحليل حتمياً (deterministic) ودعا المؤلفون إلى تحليل عدم اليقين.</li><li><b>[2] Fournadzhieva وآخرون 2002</b> (نيغريتا، اليونان): لم يُستخدم الماء الجيوحراري (47°م) في الزراعة بسبب الزرنيخ (0.5 ppm) والسترونشيوم، واستُخدم ماء عذب مُسخَّن بدلاً منه.</li><li><b>[3] Godlewska وآخرون 2015:</b> دراسة مخطط لها لبولندا؛ والتوفير المقدّر في كلفة الوسط الغذائي من الماء الجيوحراري صغير (نحو 7.1 من 153.34 دولاراً لمفاعل ضوئي سعة 1500 لتر).</li><li><b>[4] Yang وآخرون 2022</b> (منغوليا الداخلية): 11.2 غ/م²/يوم في يوليو؛ ويمكن خفض الفوسفور إلى الثلث موفِّراً 6–7% من كلفة المغذيات.</li><li><b>[5] EABA 2025:</b> دليل LCA (ISO 14040/44، مونت كارلو، مصفوفات pedigree). وفي حالته التوضيحية غيّرت طريقة التخصيص نتيجة المناخ لكل كغ من المستخلص الأزرق من 81.1 إلى 130.9 كغ CO₂-eq.</li><li><b>[6] Hossain وآخرون 2019:</b> دراسة تقنية-اقتصادية لإيثانول حيوي من كلوريلا (ليست سبيرولينا ولا LCA): تحليل حساسية لأسعار المدخلات، وتكاليف تدفئة وكهرباء إضافية شتاءً في الدول الباردة.</li><li><b>[7] Allen وآخرون 2018:</b> مراجعة: تكاليف المغذيات والماء العذب وعدم نضج التقنيات الأولية تعيق الجدوى؛ ويُقترح دمج البيولوجيا والبيئة والهندسة.</li></ul>"],
["٣. فجوة بحثية محتملة (تحتاج تحققاً)","<p>من المصادر المجموعة حتى الآن: (أ) دراسة LCA للسبيرولينا التي وجدناها حتمية [1]؛ (ب) دراسات السبيرولينا الجيوحرارية تتناول الكلفة والإنتاج والجدوى [2][3] وليست أي منها LCA بمدخلات جيوحرارية؛ (ج) توجد إرشادات لطرق عدم اليقين [5]. هذا يخص المصادر المجموعة فقط، لذا يلزم بحث منهجي في الأدبيات قبل الجزم بوجود فجوة.</p>"],
["٤. الهدف وأسئلة البحث (مبدئية)","<ul><li><b>الهدف:</b> تقييم الأداء البيئي لإنتاج <i>A. platensis</i> بالمياه الجيوحرارية في حالة يالوفا–أرموتلو.</li><li><b>س1:</b> ما المراحل والمدخلات المهيمنة على الأثر لكل 1 كغ كتلة جافة؟</li><li><b>س2:</b> كيف تغيّر الحرارة وCO₂ والماء الجيوحرارية كفاءة الموارد مقارنة بالإمداد التقليدي؟ (فرضية للاختبار: الحرارة الجيوحرارية تخفض الآثار المرتبطة بالطاقة.)</li><li><b>س3:</b> ما درجة عدم اليقين في النتائج؟</li><li><b>س4:</b> أي تكوينات تعطي أفضل مفاضلة بين الأثر والكلفة والإنتاجية؟</li></ul>"],
["٥. المنهجية المخطط لها","<ul><li>LCA وفق ISO 14040/44 [5]؛ الوحدة الوظيفية 1 كغ كتلة جافة؛ حدود من المهد إلى بوابة المصنع.</li><li>الجرد من بيانات أولية حيث تتوفر مع قاعدة بيانات خلفية؛ وطريقة تقييم الأثر ستُختار لاحقاً.</li><li>عدم اليقين: محاكاة مونت كارلو ومصفوفات pedigree؛ وتحليل الحساسية [5].</li><li>التحسين متعدد الأهداف: الطريقة والأهداف ستُحدَّد لاحقاً.</li><li>الأدوات: openLCA أو Brightway [5].</li><li>مسألة تصميمية يجب معالجتها: الزرنيخ في الماء الجيوحراري [2]. وتوفر البيانات لم يُؤكَّد بعد.</li></ul>"]]},
tr:{dir:"ltr",bk:"← Spirulina rehberine dön",f:"© 2026 Dr. Muhammet Lahmuni · Çalışma taslağı, hakem değerlendirmesinden geçmemiştir",
ti:"Jeotermal Su ile Arthrospira platensis Üretiminin Yaşam Döngüsü Değerlendirmesi: Kaynak Verimliliği, Belirsizlik Analizi ve Çok Amaçlı Optimizasyon",
st:"Bir araştırma önerisinin çalışma taslağı. İfadeler atıf yapılan literatürden gelir. Araştırma soruları, hipotezler ve yöntemler plandır, sonuç değildir.",
cap:"Olası bir sistem sınırının açıklayıcı taslağı (jeotermal ısı ve CO₂ → kültivasyon → hasat ve kurutma → kuru biyokütle). Çalışmada belirlenecektir.",rh:"Kaynaklar",
s:[["1. Neden bu konu?","<p>Spirulina tabletlerinin yayımlanmış bir beşikten kapıya YDA çalışmasında, küresel ısınma potansiyelinin %82’sine kültivasyon neden oldu; başlıca etkenler sodyum bikarbonat ve elektrikti [1]. Soğuk iklimler ısıtma yükü ekler [4][6]. Yunanistan’da serada jeotermal ısıtma ilkbahar ve sonbaharda günlük verimi %20–30 artırdı ve sezonu uzattı (Mart–Kasım); serbestçe çıkan jeotermal CO₂ ise teknolojik maliyetleri %25’ten fazla düşürdü [2].</p>"],
["2. Şimdiye kadarki kanıtlar","<ul><li><b>[1] Ye ve ark. 2018:</b> kültivasyon baskın; mevcut senaryoda tablet başına 7,7 kg CO₂-eşd./kg; daha iyi besin kullanımı etkileri %30–40 azalttı. Analiz deterministikti ve yazarlar belirsizlik analizi çağrısı yapıyor.</li><li><b>[2] Fournadzhieva ve ark. 2002</b> (Nigrita, Yunanistan): jeotermal su (47 °C), arsenik (0,5 ppm) ve stronsiyum nedeniyle kültürde kullanılmadı; yerine ısıtılmış tatlı su kullanıldı.</li><li><b>[3] Godlewska ve ark. 2015:</b> Polonya için planlanan bir çalışma; jeotermal sudan beklenen besi ortamı tasarrufu küçük (1.500 L fotobiyoreaktör için 153,34 USD’nin yaklaşık 7,1 USD’si).</li><li><b>[4] Yang ve ark. 2022</b> (İç Moğolistan): Temmuz’da 11,2 g m⁻² gün⁻¹; fosfor beslemesi üçte bire düşürülebilir ve besin maliyetinin %6–7’si tasarruf edilir.</li><li><b>[5] EABA 2025:</b> YDA rehberi (ISO 14040/44, Monte Carlo, pedigree matrisleri). Açıklayıcı örneğinde tahsis yöntemi, mavi özüt başına iklim sonucunu 81,1’den 130,9 kg CO₂-eşd.’ne değiştirdi.</li><li><b>[6] Hossain ve ark. 2019:</b> Chlorella biyoetanolü için tekno-ekonomik çalışma (Spirulina değil, YDA değil): girdi fiyatlarında duyarlılık analizi ve soğuk ülkelerde kışın ek ısıtma ve elektrik maliyeti.</li><li><b>[7] Allen ve ark. 2018:</b> derleme: besin ve tatlı su maliyetleri ile olgunlaşmamış yukarı akış teknolojileri fizibiliteyi engelliyor; biyoloji, ekoloji ve mühendisliğin entegrasyonu öneriliyor.</li></ul>"],
["3. Olası araştırma boşluğu (doğrulanmalı)","<p>Şimdiye kadar toplanan kaynaklar arasında: (a) bulunan Spirulina YDA’sı deterministik [1]; (b) jeotermal Spirulina çalışmaları maliyet, verim ve fizibiliteyi ele alıyor [2][3] ve hiçbiri jeotermal girdili bir YDA değil; (c) belirsizlik yöntemleri için rehber mevcut [5]. Bu yalnızca toplanan kaynakları kapsar; boşluk iddia etmeden önce sistematik bir literatür taraması gerekir.</p>"],
["4. Amaç ve araştırma soruları (taslak)","<ul><li><b>Amaç:</b> Yalova–Armutlu örneğinde jeotermal suyla <i>A. platensis</i> üretiminin çevresel performansını değerlendirmek.</li><li><b>AS1:</b> 1 kg kuru biyokütle başına etkilere hangi aşamalar ve girdiler hâkim?</li><li><b>AS2:</b> jeotermal ısı, CO₂ ve su, kaynak verimliliğini geleneksel tedarike göre nasıl değiştirir? (Sınanacak hipotez: jeotermal ısı enerjiyle ilgili etkileri azaltır.)</li><li><b>AS3:</b> sonuçlar ne kadar belirsiz?</li><li><b>AS4:</b> hangi yapılandırmalar etki, maliyet ve verimlilik arasında en iyi dengeyi sağlar?</li></ul>"],
["5. Planlanan yöntem","<ul><li>ISO 14040/44’e uygun YDA [5]; fonksiyonel birim 1 kg kuru biyokütle; beşikten kapıya sınır.</li><li>Envanter: mümkünse birincil veriler ve arka plan veri tabanı; etki yöntemi sonra seçilecek.</li><li>Belirsizlik: Monte Carlo simülasyonu ve pedigree matrisleri; duyarlılık analizi [5].</li><li>Çok amaçlı optimizasyon: yöntem ve amaçlar sonra seçilecek.</li><li>Araçlar: openLCA veya Brightway [5].</li><li>Ele alınacak tasarım sorunu: jeotermal sudaki arsenik [2]. Veri erişilebilirliği henüz doğrulanmadı.</li></ul>"]]}};
function render(l){const d=T[l];document.documentElement.lang=l;document.documentElement.dir=d.dir;
document.getElementById('ti').textContent=d.ti;document.getElementById('bk').textContent=d.bk;document.getElementById('f').textContent=d.f;
let h=`<div class="card warn">⚠️ ${d.st}</div><div class="card fig">${FIG}<small>${d.cap}</small></div>`;
d.s.forEach(x=>h+=`<div class="card"><h2>${x[0]}</h2>${x[1]}</div>`);
h+=`<div class="card refs"><h2>${d.rh}</h2><ol style="direction:ltr;text-align:left">${R.map(r=>`<li>${r}</li>`).join('')}</ol></div>`;
document.getElementById('m').innerHTML=h;document.title=d.ti.slice(0,60)+' | Dr. Muhammet Lahmuni';
document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
try{localStorage.setItem('lang',l)}catch(e){}}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>render(b.dataset.l));
let s='ar';try{s=localStorage.getItem('lang')||'ar'}catch(e){}render(T[s]?s:'ar');
</script></body></html>
